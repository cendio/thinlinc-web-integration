#
#  Apache configuration settings for use with ThinLinc
#

Alias /thinlinc /opt/thinlinc/share/web_integration
<Directory /opt/thinlinc/share/web_integration>
    # Apache 2.2 
    <IfModule !mod_authz_core.c> 
        Order allow,deny
        Allow from all
    </IfModule>

    # Apache 2.4 
    <IfModule mod_authz_core.c> 
        Require all granted
    </IfModule> 

    Options ExecCGI FollowSymLinks
    DirectoryIndex tlclient.cgi
    <Files tlclient.cgi>
        SetHandler cgi-script
    </Files>
</Directory> 
